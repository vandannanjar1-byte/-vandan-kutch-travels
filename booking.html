<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b5cff">
  <title>Book Your Ride | Vandan Kutch Travels</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="booking">
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark">VK</span><span><b>VANDAN KUTCH TRAVELS</b><small>Book Your Ride</small></span></a>
    <a class="icon-btn" href="index.html" aria-label="Back">←</a>
  </header>

  <main class="page narrow">
    <section class="card form-card">
      <p class="eyebrow">Mundra • Kutch • Gujarat</p>
      <h1>Book Your Ride</h1>

      <form id="bookingForm">
        <div class="field">
          <label for="service">Service</label>
          <select id="service" name="service" required>
            <option value="">Select service</option>
            <option>Airport</option>
            <option>Railway</option>
            <option>Corporate</option>
            <option>Outstation</option>
            <option>Kutch Tour</option>
          </select>
        </div>

        <div class="two">
          <div class="field"><label for="pickup">Pickup Location</label><input id="pickup" name="pickup" placeholder="e.g. The Fern Residency, Mundra" required></div>
          <div class="field"><label for="drop">Drop Location</label><input id="drop" name="drop" placeholder="e.g. Bhuj Airport" required></div>
        </div>

        <div class="field">
          <label for="airport">Select Gujarat Airport</label>
          <select id="airport" name="airport">
            <option value="">Not applicable</option>
            <option>Bhuj Airport (BHJ)</option>
            <option>Kandla Airport (IXY)</option>
            <option>Ahmedabad Airport (AMD)</option>
            <option>Rajkot Airport (HSR)</option>
            <option>Vadodara Airport (BDQ)</option>
            <option>Surat Airport (STV)</option>
          </select>
        </div>

        <div class="two">
          <div class="field"><label for="date">Date</label><input type="date" id="date" name="date" required></div>
          <div class="field"><label for="time">Time</label><input type="time" id="time" name="time" required></div>
        </div>

        <div class="two">
          <div class="field"><label for="passengers">Passengers</label><input type="number" id="passengers" name="passengers" min="1" max="7" value="1" required></div>
          <div class="field"><label for="distance">Distance (KM)</label><input type="number" id="distance" name="distance" min="1" step="0.1" placeholder="e.g. 50" required></div>
        </div>
        <div class="field"><label for="mobile">Mobile Number</label><input type="tel" id="mobile" name="mobile" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number" required></div>

        <div class="field"><label for="name">Name</label><input id="name" name="name" placeholder="Your name" required></div>

        <div class="fare-box">
          <span>Estimated fare</span>
          <strong id="fare">₹ —</strong>
          <small>Final fare will be confirmed by Vandan.</small>
        </div>

        <div class="actions">
          <button class="btn secondary" type="button" id="estimateBtn">Calculate Estimate</button>
          <button class="btn whatsapp" type="submit">Confirm via WhatsApp</button>
        </div>
        <p id="formMessage" class="form-message" role="status"></p>
      </form>
    </section>
  </main>

  <nav class="bottom-nav">
    <a href="index.html">🏠<span>Home</span></a>
    <a class="active" href="booking.html">🚕<span>Book</span></a>
    <a href="bookings.html">📋<span>Bookings</span></a>
    <a href="profile.html">👤<span>Profile</span></a>
  </nav>

  <script src="js/app.js"></script>
</body>
</html>
