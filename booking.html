<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b5cff">
  <title>Book Your Ride | Vandan Kutch Travels</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    .hidden {
      display: none !important;
    }

    .auto-location {
      background: #f3f6fb !important;
      color: #172033 !important;
      font-weight: 600;
    }

    .location-note {
      margin-top: 7px;
      color: #71809a;
      font-size: 14px;
      line-height: 1.5;
    }

    .trip-box {
      margin-bottom: 20px;
    }

    .trip-box label {
      display: block;
      margin-bottom: 9px;
      font-weight: 700;
    }

    .section-label {
      display: block;
      margin-bottom: 9px;
      font-weight: 700;
    }
  </style>
</head>

<body data-page="booking">

  <!-- TOP BAR -->
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark">VK</span>

      <span>
        <b>VANDAN KUTCH TRAVELS</b>
        <small>Book Your Ride</small>
      </span>
    </a>

    <a class="icon-btn" href="index.html" aria-label="Back">
      ←
    </a>
  </header>


  <!-- MAIN -->
  <main class="page narrow">

    <section class="card form-card">

      <p class="eyebrow">
        Mundra • Kutch • Gujarat
      </p>

      <h1>
        Book Your Ride
      </h1>


      <form id="bookingForm">

        <!-- SERVICE -->
        <div class="field">

          <label for="service">
            Service
          </label>

          <select id="service" name="service" required>

            <option value="">
              Select service
            </option>

            <option value="Airport">
              Airport
            </option>

            <option value="Railway">
              Railway
            </option>

            <option value="Corporate">
              Corporate
            </option>

            <option value="Outstation">
              Outstation
            </option>

            <option value="Kutch Tour">
              Kutch Tour
            </option>

          </select>

        </div>


        <!-- AIRPORT / RAILWAY DIRECTION -->
        <div
          class="field hidden"
          id="tripTypeBox"
        >

          <label for="tripType">
            Pickup / Drop
          </label>

          <select
            id="tripType"
            name="tripType"
          >

            <option value="">
              Select
            </option>

            <option value="Pickup">
              Pickup
            </option>

            <option value="Drop">
              Drop
            </option>

          </select>

        </div>


        <!-- AIRPORT SELECT -->
        <div
          class="field hidden"
          id="airportBox"
        >

          <label for="airport">
            Select Gujarat Airport
          </label>

          <select
            id="airport"
            name="airport"
          >

            <option value="">
              Select Airport
            </option>

            <option value="Bhuj Airport (BHJ)">
              Bhuj Airport (BHJ)
            </option>

            <option value="Kandla Airport (IXY)">
              Kandla Airport (IXY)
            </option>

            <option value="Ahmedabad Airport (AMD)">
              Ahmedabad Airport (AMD)
            </option>

            <option value="Rajkot International Airport (HSR)">
              Rajkot International Airport (HSR)
            </option>

            <option value="Vadodara Airport (BDQ)">
              Vadodara Airport (BDQ)
            </option>

            <option value="Surat Airport (STV)">
              Surat Airport (STV)
            </option>

            <option value="Bhavnagar Airport (BHU)">
              Bhavnagar Airport (BHU)
            </option>

            <option value="Jamnagar Airport (JGA)">
              Jamnagar Airport (JGA)
            </option>

          </select>

        </div>


        <!-- RAILWAY SELECT -->
        <div
          class="field hidden"
          id="railwayBox"
        >

          <label for="railway">
            Select Gujarat Railway Station
          </label>

          <select
            id="railway"
            name="railway"
          >

            <option value="">
              Select Railway Station
            </option>

            <option value="Bhuj Railway Station (BHUJ)">
              Bhuj Railway Station (BHUJ)
            </option>

            <option value="Gandhidham Junction (GIMB)">
              Gandhidham Junction (GIMB)
            </option>

            <option value="Anjar Railway Station (AJE)">
              Anjar Railway Station (AJE)
            </option>

            <option value="Adipur Junction (AI)">
              Adipur Junction (AI)
            </option>

            <option value="Samakhiali Junction (SIOB)">
              Samakhiali Junction (SIOB)
            </option>

            <option value="Ahmedabad Junction (ADI)">
              Ahmedabad Junction (ADI)
            </option>

            <option value="Gandhinagar Capital (GNC)">
              Gandhinagar Capital (GNC)
            </option>

            <option value="Mehsana Junction (MSH)">
              Mehsana Junction (MSH)
            </option>

            <option value="Rajkot Junction (RJT)">
              Rajkot Junction (RJT)
            </option>

            <option value="Vadodara Junction (BRC)">
              Vadodara Junction (BRC)
            </option>

            <option value="Surat Railway Station (ST)">
              Surat Railway Station (ST)
            </option>

            <option value="Bhavnagar Terminus (BVC)">
              Bhavnagar Terminus (BVC)
            </option>

            <option value="Jamnagar Railway Station (JAM)">
              Jamnagar Railway Station (JAM)
            </option>

            <option value="Porbandar Railway Station (PBR)">
              Porbandar Railway Station (PBR)
            </option>

          </select>

        </div>


        <!-- PICKUP -->
        <div class="field">

          <label for="pickup">
            Pickup Location
          </label>

          <input
            id="pickup"
            name="pickup"
            placeholder="e.g. The Fern Residency, Mundra"
            required
          >

          <p
            id="pickupNote"
            class="location-note hidden"
          ></p>

        </div>


        <!-- DROP -->
        <div class="field">

          <label for="drop">
            Drop Location
          </label>

          <input
            id="drop"
            name="drop"
            placeholder="e.g. Bhuj Airport"
            required
          >

          <p
            id="dropNote"
            class="location-note hidden"
          ></p>

        </div>


        <!-- DATE + TIME -->
        <div class="two">

          <div class="field">

            <label for="date">
              Date
            </label>

            <input
              type="date"
              id="date"
              name="date"
              required
            >

          </div>


          <div class="field">

            <label for="time">
              Time
            </label>

            <input
              type="time"
              id="time"
              name="time"
              required
            >

          </div>

        </div>


        <!-- PASSENGERS + DISTANCE -->
        <div class="two">

          <div class="field">

            <label for="passengers">
              Passengers
            </label>

            <input
              type="number"
              id="passengers"
              name="passengers"
              min="1"
              max="7"
              value="1"
              required
            >

          </div>


          <div class="field">

            <label for="distance">
              Distance (KM)
            </label>

            <input
              type="number"
              id="distance"
              name="distance"
              min="1"
              step="0.1"
              placeholder="e.g. 50"
              required
            >

          </div>

        </div>


        <!-- MOBILE -->
        <div class="field">

          <label for="mobile">
            Mobile Number
          </label>

          <input
            type="tel"
            id="mobile"
            name="mobile"
            inputmode="numeric"
            maxlength="10"
            placeholder="10-digit mobile number"
            required
          >

        </div>


        <!-- NAME -->
        <div class="field">

          <label for="name">
            Name
          </label>

          <input
            id="name"
            name="name"
            placeholder="Your name"
            required
          >

        </div>


        <!-- FARE -->
        <div class="fare-box">

          <span>
            Estimated fare
          </span>

          <strong id="fare">
            ₹ —
          </strong>

          <small>
            Final fare will be confirmed by Vandan.
          </small>

        </div>


        <!-- BUTTONS -->
        <div class="actions">

          <button
            class="btn secondary"
            type="button"
            id="estimateBtn"
          >
            Calculate Estimate
          </button>


          <button
            class="btn whatsapp"
            type="submit"
          >
            Confirm via WhatsApp
          </button>

        </div>


        <p
          id="formMessage"
          class="form-message"
          role="status"
        ></p>

      </form>

    </section>

  </main>


  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">

    <a href="index.html">
      🏠
      <span>Home</span>
    </a>

    <a
      class="active"
      href="booking.html"
    >
      🚕
      <span>Book</span>
    </a>

    <a href="bookings.html">
      📋
      <span>Bookings</span>
    </a>

    <a href="profile.html">
      👤
      <span>Profile</span>
    </a>

  </nav>


  <!-- EXISTING APP JS -->
  <script src="js/app.js"></script>


  <!-- BOOKING PAGE LOGIC -->
  <script>

    const service = document.getElementById("service");

    const tripTypeBox = document.getElementById("tripTypeBox");
    const tripType = document.getElementById("tripType");

    const airportBox = document.getElementById("airportBox");
    const airport = document.getElementById("airport");

    const railwayBox = document.getElementById("railwayBox");
    const railway = document.getElementById("railway");

    const pickup = document.getElementById("pickup");
    const drop = document.getElementById("drop");

    const pickupNote = document.getElementById("pickupNote");
    const dropNote = document.getElementById("dropNote");


    /*
      SERVICE CHANGE
    */

    service.addEventListener("change", function () {

      const selectedService = this.value;

      // Reset
      tripTypeBox.classList.add("hidden");
      airportBox.classList.add("hidden");
      railwayBox.classList.add("hidden");

      tripType.value = "";
      airport.value = "";
      railway.value = "";

      resetLocations();


      /*
        AIRPORT
      */

      if (selectedService === "Airport") {

        tripTypeBox.classList.remove("hidden");
        airportBox.classList.remove("hidden");

        tripType.required = true;
        airport.required = true;

        railway.required = false;

      }


      /*
        RAILWAY
      */

      else if (selectedService === "Railway") {

        tripTypeBox.classList.remove("hidden");
        railwayBox.classList.remove("hidden");

        tripType.required = true;
        railway.required = true;

        airport.required = false;

      }


      /*
        OTHER SERVICES
      */

      else {

        tripType.required = false;
        airport.required = false;
        railway.required = false;

      }

    });


    /*
      TRIP TYPE CHANGE
    */

    tripType.addEventListener("change", updateLocations);


    /*
      AIRPORT CHANGE
    */

    airport.addEventListener("change", updateLocations);


    /*
      RAILWAY CHANGE
    */

    railway.addEventListener("change", updateLocations);


    function updateLocations() {

      const selectedService = service.value;
      const selectedTrip = tripType.value;


      /*
        AIRPORT
      */

      if (selectedService === "Airport") {

        const selectedAirport = airport.value;

        if (!selectedAirport) {
          resetLocations();
          return;
        }


        /*
          AIRPORT PICKUP

          Pickup = AUTOMATIC
          Drop = MANUAL
        */

        if (selectedTrip === "Pickup") {

          pickup.value = selectedAirport;

          pickup.readOnly = true;
          pickup.classList.add("auto-location");

          pickupNote.textContent =
            "✈️ Airport Pickup: Airport location automatic આવી ગયું છે.";

          pickupNote.classList.remove("hidden");


          drop.value = "";
          drop.readOnly = false;
          drop.classList.remove("auto-location");

          drop.placeholder =
            "e.g. Mundra, Hotel, Home";

          dropNote.textContent =
            "📍 Drop Location તમે manually નાખશો.";

          dropNote.classList.remove("hidden");

        }


        /*
          AIRPORT DROP

          Pickup = MANUAL
          Drop = AUTOMATIC
        */

        else if (selectedTrip === "Drop") {

          pickup.value = "";
          pickup.readOnly = false;
          pickup.classList.remove("auto-location");

          pickup.placeholder =
            "e.g. Mundra, Hotel, Home";

          pickupNote.textContent =
            "📍 Pickup Location તમે manually નાખશો.";

          pickupNote.classList.remove("hidden");


          drop.value = selectedAirport;

          drop.readOnly = true;
          drop.classList.add("auto-location");

          dropNote.textContent =
            "✈️ Airport Drop: Airport location automatic આવી ગયું છે.";

          dropNote.classList.remove("hidden");

        }

      }


      /*
        RAILWAY
      */

      else if (selectedService === "Railway") {

        const selectedStation = railway.value;

        if (!selectedStation) {
          resetLocations();
          return;
        }


        /*
          RAILWAY PICKUP

          Pickup = AUTOMATIC
          Drop = MANUAL
        */

        if (selectedTrip === "Pickup") {

          pickup.value = selectedStation;

          pickup.readOnly = true;
          pickup.classList.add("auto-location");

          pickupNote.textContent =
            "🚆 Railway Pickup: Railway Station location automatic આવી ગયું છે.";

          pickupNote.classList.remove("hidden");


          drop.value = "";
          drop.readOnly = false;
          drop.classList.remove("auto-location");

          drop.placeholder =
            "e.g. Mundra, Hotel, Home";

          dropNote.textContent =
            "📍 Drop Location તમે manually નાખશો.";

          dropNote.classList.remove("hidden");

        }


        /*
          RAILWAY DROP

          Pickup = MANUAL
          Drop = AUTOMATIC
        */

        else if (selectedTrip === "Drop") {

          pickup.value = "";
          pickup.readOnly = false;
          pickup.classList.remove("auto-location");

          pickup.placeholder =
            "e.g. Mundra, Hotel, Home";

          pickupNote.textContent =
            "📍 Pickup Location તમે manually નાખશો.";

          pickupNote.classList.remove("hidden");


          drop.value = selectedStation;

          drop.readOnly = true;
          drop.classList.add("auto-location");

          dropNote.textContent =
            "🚆 Railway Drop: Railway Station location automatic આવી ગયું છે.";

          dropNote.classList.remove("hidden");

        }

      }

    }


    /*
      RESET LOCATIONS
    */

    function resetLocations() {

      pickup.value = "";
      drop.value = "";

      pickup.readOnly = false;
      drop.readOnly = false;

      pickup.classList.remove("auto-location");
      drop.classList.remove("auto-location");

      pickup.placeholder =
        "e.g. The Fern Residency, Mundra";

      drop.placeholder =
        "e.g. Bhuj Airport";

      pickupNote.textContent = "";
      dropNote.textContent = "";

      pickupNote.classList.add("hidden");
      dropNote.classList.add("hidden");

    }


    /*
      IF USER CHANGES SERVICE
      MAKE SURE LOCATION STATE IS CORRECT
    */

    resetLocations();

  </script>

</body>
</html>
